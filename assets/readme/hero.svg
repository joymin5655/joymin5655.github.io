<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Yongmin Cho — AI Agent / Infrastructure Engineer">
  <title>Yongmin Cho — AI Agent / Infrastructure Engineer</title>
  <style>
    :root { --bg: #0a0c10; --bg-deep: #06080b; --ink: #edeff4; --muted: #8a93a6; --line: #232936; --signal: #d7ff3f; }
    .bg { fill: var(--bg); }
    .dot { fill: var(--ink); }
    .ko-word { fill: var(--ink); font: 700 66px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: 6px; }
    .sub { fill: var(--muted); font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; }
    .live { fill: var(--muted); font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }

    .en-letter { opacity: 1; transform: translateY(0); animation: enCycle 10s cubic-bezier(.25,.6,.3,1) infinite; }
    .ko-word { opacity: 0; transform: translateY(-6px); animation: koCycle 10s cubic-bezier(.25,.6,.3,1) infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes enCycle {
      0%, 28% { opacity: 1; transform: translateY(0); }
      36%, 64% { opacity: 0; transform: translateY(6px); }
      92%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes koCycle {
      0%, 32% { opacity: 0; transform: translateY(-6px); }
      40%, 60% { opacity: 1; transform: translateY(0); }
      68%, 100% { opacity: 0; transform: translateY(-6px); }
    }

    .scan { animation: scan 4.5s ease-in-out infinite; }
    @keyframes scan {
      0% { transform: translateX(0); opacity: .15; }
      50% { transform: translateX(310px); opacity: .8; }
      100% { transform: translateX(620px); opacity: .15; }
    }
    .ping { animation: ping 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping {
      0%, 100% { opacity: .4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    .radar { animation: radar 7s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect class="bg" width="900" height="300"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--line)" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="900" height="300" fill="url(#grid)" opacity=".5"/>

  <g transform="translate(854,40)">
    <circle r="16" fill="none" stroke="var(--line)" stroke-width="2"/>
    <path class="radar" d="M 0 -16 A 16 16 0 0 1 16 0" fill="none" stroke="var(--signal)" stroke-width="2" stroke-linecap="round"/>
    <circle class="ping" r="3" fill="var(--signal)"/>
  </g>
